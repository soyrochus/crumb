name: verify

# Release verification only. Each run compiles the Linux native addon from
# source and builds two executables on two platforms, which is far too
# expensive to spend on every push. Day-to-day checking is local:
# `bun test`, `bun run typecheck`, `bun run verify:readonly`.
#
# Triggers on version tags of the form v<major>.<minor>.<patch> — v1.0.0,
# v0.2.13. Pre-release and build suffixes (v1.0.0-rc1) do not match.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  # A release verification is never superseded; let it finish.
  cancel-in-progress: false

jobs:
  verify:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS arm64
            target: macos-arm64
          - os: ubuntu-24.04
            label: Linux x64
            target: linux-x64
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      # The Linux native addon is compiled from a checksum-pinned source patch
      # on every run. This is the slowest step in the workflow by a wide margin
      # and is the concrete argument for prebuilding the addon.
      - name: Install Linux WebView toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential cargo libgtk-3-dev libjavascriptcoregtk-4.1-0 \
            libwebkit2gtk-4.1-dev patch pkg-config rustc

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Verify the example's read-only boundary
        run: bun run verify:readonly

      - name: Build the starter
        run: bun run build --target=${{ matrix.target }}

      - name: Build the file-explorer example
        run: bun run build --example=file-explorer --target=${{ matrix.target }}

      - name: Inspect artifacts
        run: ls -la dist/
